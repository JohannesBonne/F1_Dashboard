
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Race Center</title>

<style>
:root {
  --bg: #101014;
  --panel: #19191f;
  --panel2: #222229;
  --border: #303039;
  --text: #f5f5f6;
  --muted: #9999a3;
  --red: #e10600;
  --green: #35c77a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
}

.top-line {
  height: 4px;
  background: var(--red);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 14px 11px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 19px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: -1px;
}

.brand-mark {
  color: var(--red);
  font-size: 24px;
}

.season {
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--panel2);
  color: var(--muted);
  font-size: 10px;
  font-weight: bold;
}

.tabs {
  display: flex;
  gap: 5px;
  padding: 0 12px 11px;
}

.tab {
  flex: 1;
  padding: 9px 4px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--panel);
  color: var(--muted);
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
}

.tab:hover {
  background: var(--panel2);
  color: white;
}

.tab.active {
  background: var(--red);
  border-color: var(--red);
  color: white;
}

.content {
  padding: 0 12px 12px;
}

.view.hidden {
  display: none;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 3px 0 10px;
}

.section-title {
  font-size: 14px;
  font-weight: bold;
}

.race-name {
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
}

.refresh {
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--panel2);
  color: white;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
}

.refresh:hover {
  border-color: var(--red);
}

.refresh:disabled {
  opacity: 0.5;
  cursor: wait;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
}

table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
  font-size: 11px;
}

th {
  padding: 9px 7px;
  background: var(--panel2);
  color: var(--muted);
  text-align: left;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

td {
  padding: 8px 7px;
  border-top: 1px solid #292930;
}

tbody tr:hover {
  background: #25252c;
}

.position {
  color: var(--muted);
  font-weight: bold;
}

.driver {
  color: white;
  font-weight: bold;
}

.team {
  color: var(--muted);
  font-size: 10px;
}

.points {
  text-align: right;
  font-weight: bold;
}

.wins {
  color: var(--muted);
  text-align: right;
}

.message {
  padding: 22px 12px;
  color: var(--muted);
  text-align: center;
  line-height: 1.5;
}

.message strong {
  display: block;
  margin-bottom: 5px;
  color: white;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 20px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 10px;
  overflow-wrap: anywhere;
}

.dot {
  width: 7px;
  height: 7px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--green);
}

.dot.loading {
  background: #e0aa36;
}

.dot.error {
  background: var(--red);
}

.footer {
  padding: 8px 12px 12px;
  color: #686871;
  text-align: center;
  font-size: 9px;
}

@media (max-width: 360px) {
  .brand {
    font-size: 17px;
  }

  .tab {
    padding: 8px 2px;
    font-size: 10px;
  }

  td, th {
    padding-left: 5px;
    padding-right: 5px;
  }
}
</style>
</head>

<body>

<div class="top-line"></div>

<header class="header">
  <div class="brand">
    <span class="brand-mark">F1</span>
    <span>RACE CENTER</span>
  </div>

  <div class="season" id="season">SAISON</div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="results">
    Ergebnisse
  </button>

  <button class="tab" data-tab="drivers">
    Fahrer-WM
  </button>

  <button class="tab" data-tab="teams">
    Team-WM
  </button>
</nav>

<main class="content">

  <section id="results" class="view">
    <div class="section-head">
      <div>
        <div class="section-title">Letztes Rennen</div>
        <div class="race-name" id="raceName">
          Wird geladen …
        </div>
      </div>

      <button class="refresh" id="refresh">
        ↻ Aktualisieren
      </button>
    </div>

    <div class="table-wrap" id="resultsContent">
      <div class="message">
        Ergebnisse werden geladen …
      </div>
    </div>
  </section>

  <section id="drivers" class="view hidden">
    <div class="section-head">
      <div class="section-title">
        Fahrer-Weltmeisterschaft
      </div>

      <button class="refresh" data-refresh>
        ↻ Aktualisieren
      </button>
    </div>

    <div class="table-wrap" id="driversContent">
      <div class="message">
        Fahrerwertung wird geladen …
      </div>
    </div>
  </section>

  <section id="teams" class="view hidden">
    <div class="section-head">
      <div class="section-title">
        Konstrukteurs-WM
      </div>

      <button class="refresh" data-refresh>
        ↻ Aktualisieren
      </button>
    </div>

    <div class="table-wrap" id="teamsContent">
      <div class="message">
        Teamwertung wird geladen …
      </div>
    </div>
  </section>

  <div class="status" id="status">
    <span class="dot loading"></span>
    <span id="statusText">
      Verbindung wird hergestellt …
    </span>
  </div>

</main>

<footer class="footer">
  F1 Daten von Jolpica API
</footer>

<script>
"use strict";

/* ----------------------------------
   KONFIGURATION
---------------------------------- */

const API_BASE = "https://api.jolpi.ca/ergast/f1";

const ENDPOINTS = {
  results: "/current/last/results.json?limit=100",
  drivers: "/current/driverstandings.json?limit=100",
  teams: "/current/constructorstandings.json?limit=100"
};

const TIMEOUT = 12000;
const CACHE_DURATION = 5 * 60 * 1000;

/* ----------------------------------
   ELEMENTE
---------------------------------- */

const el = {
  season: document.getElementById("season"),
  raceName: document.getElementById("raceName"),
  results: document.getElementById("resultsContent"),
  drivers: document.getElementById("driversContent"),
  teams: document.getElementById("teamsContent"),
  status: document.getElementById("status"),
  statusText: document.getElementById("statusText"),
  refresh: document.getElementById("refresh")
};

el.season.textContent =
  "SAISON " + new Date().getFullYear();

let loading = false;

/* ----------------------------------
   STATUS UND MELDUNGEN
---------------------------------- */

function setStatus(message, type = "ok") {
  const dot = el.status.querySelector(".dot");

  dot.className = "dot";

  if (type === "loading") {
    dot.classList.add("loading");
  }

  if (type === "error") {
    dot.classList.add("error");
  }

  el.statusText.textContent = message;
}

function showMessage(container, title, detail = "") {
  container.replaceChildren();

  const box = document.createElement("div");
  box.className = "message";

  const heading = document.createElement("strong");
  heading.textContent = title;

  const description = document.createElement("span");
  description.textContent = detail;

  box.append(heading, description);
  container.appendChild(box);
}

/* ----------------------------------
   LOKALER CACHE
---------------------------------- */

function getCache(key) {
  try {
    const stored = localStorage.getItem("f1_" + key);

    if (!stored) return null;

    const cache = JSON.parse(stored);

    if (!cache.timestamp || !cache.data) {
      return null;
    }

    if (Date.now() - cache.timestamp > CACHE_DURATION) {
      return null;
    }

    return cache.data;

  } catch {
    return null;
  }
}

function saveCache(key, data) {
  try {
    localStorage.setItem(
      "f1_" + key,
      JSON.stringify({
        timestamp: Date.now(),
        data: data
      })
    );

  } catch {
    // Die Seite funktioniert auch ohne lokalen Speicher.
  }
}

/* ----------------------------------
   API-ABRUF MIT ZEITLIMIT
---------------------------------- */

async function fetchData(key, force = false) {
  if (!force) {
    const cached = getCache(key);

    if (cached) {
      return {
        data: cached,
        cached: true
      };
    }
  }

  const controller = new AbortController();

  const timeoutId = setTimeout(() => {
    controller.abort();
  }, TIMEOUT);

  try {
    const response = await fetch(
      API_BASE + ENDPOINTS[key],
      {
        method: "GET",
        mode: "cors",
        credentials: "omit",
        headers: {
          "Accept": "application/json"
        },
        signal: controller.signal,
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const json = await response.json();

    if (!json || !json.MRData) {
      throw new Error("Ungültige API-Antwort");
    }

    saveCache(key, json.MRData);

    return {
      data: json.MRData,
      cached: false
    };

  } catch (error) {
    if (error.name === "AbortError") {
      throw new Error(
        "Zeitüberschreitung nach 12 Sekunden"
      );
    }

    if (error instanceof TypeError) {
      throw new Error(
        "Verbindung fehlgeschlagen. " +
        "Möglicherweise blockiert die API den Browserzugriff."
      );
    }

    throw error;

  } finally {
    clearTimeout(timeoutId);
  }
}

/* ----------------------------------
   TABELLEN
---------------------------------- */

function createCell(row, value, className = "") {
  const cell = document.createElement("td");

  cell.textContent =
    value === null || value === undefined || value === ""
      ? "–"
      : value;

  if (className) {
    cell.className = className;
  }

  row.appendChild(cell);
  return cell;
}

function createTable(headers, rows) {
  const table = document.createElement("table");

  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");

  headers.forEach(header => {
    const th = document.createElement("th");
    th.textContent = header;
    headRow.appendChild(th);
  });

  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  rows.forEach(row => {
    tbody.appendChild(row);
  });

  table.appendChild(tbody);

  return table;
}

/* ----------------------------------
   LETZTES RENNEN
---------------------------------- */

function renderResults(data) {
  const races = data.RaceTable?.Races || [];

  if (races.length === 0) {
    el.raceName.textContent =
      "Keine Rennergebnisse verfügbar";

    showMessage(
      el.results,
      "Keine Ergebnisse vorhanden",
      "Für diese Saison wurde noch kein Rennen abgeschlossen."
    );

    return;
  }

  const race = races[0];
  const results = race.Results || [];

  el.raceName.textContent =
    race.raceName + " · " +
    (race.Circuit?.circuitName || "");

  if (results.length === 0) {
    showMessage(
      el.results,
      "Keine Resultate gefunden"
    );

    return;
  }

  const rows = results.map(result => {
    const row = document.createElement("tr");

    const driver = result.Driver || {};
    const constructor = result.Constructor || {};

    const driverName =
      (driver.givenName || "") + " " +
      (driver.familyName || "");

    const resultTime =
      result.Time?.time ||
      result.status ||
      "–";

    createCell(row, result.position, "position");
    createCell(row, driverName.trim(), "driver");
    createCell(row, constructor.name, "team");
    createCell(row, result.points, "points");
    createCell(row, resultTime);

    return row;
  });

  el.results.replaceChildren(
    createTable(
      ["Pos.", "Fahrer", "Team", "Pkt.", "Zeit / Status"],
      rows
    )
  );
}

/* ----------------------------------
   FAHRER-WM
---------------------------------- */

function renderDrivers(data) {
  const standings =
    data.StandingsTable?.StandingsLists?.[0]
      ?.DriverStandings || [];

  if (standings.length === 0) {
    showMessage(
      el.drivers,
      "Keine Fahrerwertung verfügbar",
      "Die API hat aktuell keine Fahrerwertung geliefert."
    );

    return;
  }

  const rows = standings.map(item => {
    const row = document.createElement("tr");

    const driver = item.Driver || {};
    const constructor = item.Constructors?.[0] || {};

    const name =
      (driver.givenName || "") + " " +
      (driver.familyName || "");

    createCell(row, item.position, "position");
    createCell(row, name.trim(), "driver");
    createCell(row, constructor.name, "team");
    createCell(row, item.points, "points");
    createCell(row, item.wins, "wins");

    return row;
  });

  el.drivers.replaceChildren(
    createTable(
      ["Pos.", "Fahrer", "Team", "Pkt.", "Siege"],
      rows
    )
  );
}

/* ----------------------------------
   TEAM-WM
---------------------------------- */

function renderTeams(data) {
  const standings =
    data.StandingsTable?.StandingsLists?.[0]
      ?.ConstructorStandings || [];

  if (standings.length === 0) {
    showMessage(
      el.teams,
      "Keine Teamwertung verfügbar",
      "Die API hat aktuell keine Konstrukteurswertung geliefert."
    );

    return;
  }

  const rows = standings.map(item => {
    const row = document.createElement("tr");

    const constructor = item.Constructor || {};

    createCell(row, item.position, "position");
    createCell(row, constructor.name, "driver");
    createCell(row, item.points, "points");
    createCell(row, item.wins, "wins");

    return row;
  });

  el.teams.replaceChildren(
    createTable(
      ["Pos.", "Team", "Pkt.", "Siege"],
      rows
    )
  );
}

/* ----------------------------------
   DASHBOARD LADEN
---------------------------------- */

async function loadDashboard(force = false) {
  if (loading) return;

  loading = true;

  setStatus("Daten werden geladen …", "loading");

  el.refresh.disabled = true;
  el.refresh.textContent = "Lädt …";

  const refreshButtons =
    document.querySelectorAll("[data-refresh]");

  refreshButtons.forEach(button => {
    button.disabled = true;
    button.textContent = "Lädt …";
  });

  const requests = [
    {
      key: "results",
      render: renderResults,
      container: el.results
    },
    {
      key: "drivers",
      render: renderDrivers,
      container: el.drivers
    },
    {
      key: "teams",
      render: renderTeams,
      container: el.teams
    }
  ];

  let errors = [];
  let cachedCount = 0;

  try {
    const outcomes = await Promise.allSettled(
      requests.map(request =>
        fetchData(request.key, force)
      )
    );

    outcomes.forEach((outcome, index) => {
      const request = requests[index];

      if (outcome.status === "fulfilled") {
        try {
          request.render(outcome.value.data);

          if (outcome.value.cached) {
            cachedCount++;
          }

        } catch (error) {
          errors.push(
            request.key + ": " + error.message
          );

          showMessage(
            request.container,
            "Darstellungsfehler",
            error.message
          );
        }

      } else {
        errors.push(
          request.key + ": " +
          outcome.reason.message
        );

        showMessage(
          request.container,
          "Daten konnten nicht geladen werden",
          outcome.reason.message
        );
      }
    });

    if (errors.length > 0) {
      setStatus(
        errors.length +
        " Bereich(e) konnten nicht geladen werden.",
        "error"
      );

    } else if (cachedCount === 3) {
      setStatus(
        "Daten aus dem lokalen Zwischenspeicher."
      );

    } else if (cachedCount > 0) {
      setStatus(
        "Daten teilweise aus dem Zwischenspeicher."
      );

    } else {
      setStatus(
        "Alle Daten erfolgreich geladen."
      );
    }

  } catch (error) {
    setStatus(error.message, "error");

  } finally {
    loading = false;

    el.refresh.disabled = false;
    el.refresh.textContent = "↻ Aktualisieren";

    refreshButtons.forEach(button => {
      button.disabled = false;
      button.textContent = "↻ Aktualisieren";
    });
  }
}

/* ----------------------------------
   TAB-NAVIGATION
---------------------------------- */

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    const tabName = tab.dataset.tab;

    document.querySelectorAll(".tab").forEach(item => {
      item.classList.toggle(
        "active",
        item === tab
      );
    });

    document.querySelectorAll(".view").forEach(view => {
      view.classList.toggle(
        "hidden",
        view.id !== tabName
      );
    });
  });
});

/* ----------------------------------
   AKTUALISIERUNG
---------------------------------- */

el.refresh.addEventListener("click", () => {
  loadDashboard(true);
});

document.querySelectorAll("[data-refresh]").forEach(button => {
  button.addEventListener("click", () => {
    loadDashboard(true);
  });
});

/* ----------------------------------
   STARTEN
---------------------------------- */

loadDashboard();

</script>

</body>
</html>
