
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15151e">
<title>Formula 1 Dashboard</title>

<style>
:root {
    --bg: #15151e;
    --panel: #202029;
    --line: #383841;
    --text: #f5f5f5;
    --muted: #a7a7b1;
    --red: #e10600;
    --yellow: #f5c542;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
}

.app {
    width: 100%;
    min-height: 100vh;
}

.topline {
    height: 3px;
    background: var(--red);
}

/* HEADER */

header {
    padding: 9px 13px;
    background: #191920;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 21px;
    font-weight: 1000;
    font-style: italic;
    letter-spacing: -2px;
}

.season {
    font-size: 10px;
    color: var(--muted);
    font-weight: 800;
}

/* NAVIGATION */

.tabs {
    display: flex;
    gap: 3px;
    padding: 7px 9px;
    background: #191922;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
}

.tab {
    flex: 1;
    border: 0;
    background: transparent;
    color: #aaaab4;
    padding: 9px 4px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
    border-bottom: 2px solid transparent;
}

.tab.active {
    background: #302023;
    color: white;
    border-bottom-color: var(--red);
}

/* CONTENT */

main {
    padding: 10px;
}

.view {
    display: none;
}

.view.active {
    display: block;
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin-bottom: 9px;
}

.section-head h2 {
    font-size: 15px;
    margin: 0;
    font-weight: 900;
    text-transform: uppercase;
}

.meta {
    color: var(--muted);
    font-size: 10px;
    margin-top: 3px;
}

.refresh {
    border: 1px solid #45454f;
    background: #292932;
    color: #ddd;
    border-radius: 3px;
    padding: 6px 8px;
    font-size: 10px;
    cursor: pointer;
    white-space: nowrap;
}

/* RACE CARD */

.race-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    overflow: hidden;
}

.race-banner {
    padding: 9px 11px;
    background: linear-gradient(100deg, #3a1719, #24242d 70%);
    border-left: 3px solid var(--red);
}

.race-name {
    font-size: 15px;
    font-weight: 900;
    text-transform: uppercase;
}

.race-detail {
    color: #c5c5ce;
    font-size: 10px;
    margin-top: 3px;
}

/* TABLES */

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 0;
}

th {
    text-align: left;
    color: #9999a5;
    font-size: 9px;
    text-transform: uppercase;
    padding: 7px 8px;
    background: #24242d;
    white-space: nowrap;
}

td {
    padding: 7px 8px;
    border-top: 1px solid #34343d;
    font-size: 11px;
    line-height: 1.2;
}

tbody tr:hover {
    background: #292932;
}

.pos {
    font-weight: 900;
    font-size: 12px;
    width: 30px;
}

.pos.first {
    color: var(--yellow);
}

.driver {
    font-weight: 800;
}

.team {
    color: var(--muted);
    font-size: 10px;
    margin-top: 2px;
}

.points {
    font-weight: 900;
    text-align: right;
    white-space: nowrap;
}

.pill {
    display: inline-block;
    border-radius: 3px;
    padding: 2px 4px;
    background: #33333d;
    color: #ddd;
    font-size: 9px;
    font-weight: 800;
}

/* TEAM WM */

.team-name {
    font-weight: 800;
}

.team-points {
    font-size: 12px;
    font-weight: 900;
    text-align: right;
    white-space: nowrap;
}

/* LOADING / ERRORS */

.loading,
.empty,
.error {
    padding: 18px;
    text-align: center;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
}

.error {
    color: #ff9b97;
}

/* FOOTER */

footer {
    border-top: 1px solid var(--line);
    padding: 8px 11px;
    color: #858590;
    font-size: 9px;
    display: flex;
    justify-content: space-between;
    gap: 5px;
    flex-wrap: wrap;
}

footer a {
    color: #bdbdc6;
    text-decoration: none;
}

/* SMALL WIDGET */

@media(max-width: 450px) {

    main {
        padding: 7px;
    }

    header {
        padding: 7px 10px;
    }

    .tabs {
        padding: 5px;
    }

    .tab {
        font-size: 10px;
        padding: 8px 2px;
    }

    .section-head h2 {
        font-size: 13px;
    }

    th {
        padding: 6px 5px;
        font-size: 8px;
    }

    td {
        padding: 6px 5px;
        font-size: 10px;
    }

    .team {
        font-size: 9px;
    }
}

</style>
</head>

<body>

<div class="app">

<div class="topline"></div>

<header>
    <div class="logo">F1</div>
    <div class="season" id="seasonBadge">SAISON —</div>
</header>

<nav class="tabs">

    <button class="tab active" data-view="results">
        Ergebnisse
    </button>

    <button class="tab" data-view="drivers">
        Fahrer-WM
    </button>

    <button class="tab" data-view="teams">
        Team-WM
    </button>

</nav>

<main>

<!-- ERGEBNISSE -->

<section class="view active" id="results">

    <div class="section-head">
        <div>
            <h2>Letztes Rennen</h2>
            <div class="meta" id="raceMeta">Lade Ergebnisse ...</div>
        </div>

        <button class="refresh" id="refreshResults">
            ↻
        </button>
    </div>

    <div id="raceContent" class="loading">
        Rennergebnisse werden geladen ...
    </div>

</section>


<!-- FAHRER WM -->

<section class="view" id="drivers">

    <div class="section-head">
        <div>
            <h2>Fahrer-WM</h2>
            <div class="meta" id="driverMeta">
                Aktueller Meisterschaftsstand
            </div>
        </div>

        <button class="refresh" id="refreshDrivers">
            ↻
        </button>
    </div>

    <div id="driverContent" class="loading">
        Fahrerwertung wird geladen ...
    </div>

</section>


<!-- TEAM WM -->

<section class="view" id="teams">

    <div class="section-head">
        <div>
            <h2>Team-WM</h2>
            <div class="meta" id="teamMeta">
                Aktueller Meisterschaftsstand
            </div>
        </div>

        <button class="refresh" id="refreshTeams">
            ↻
        </button>
    </div>

    <div id="teamContent" class="loading">
        Teamwertung wird geladen ...
    </div>

</section>

</main>

<footer>
    <span id="updated">Jolpica F1 API</span>
    <span>Formula 1 Dashboard</span>
</footer>

</div>


<script>

const API = 'https://api.jolpi.ca/ergast/f1';
const YEAR = 'current';

const $ = id => document.getElementById(id);

const number = value =>
    Number(value || 0).toLocaleString('de-DE');

const escapeHTML = value =>
    String(value ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
    }[c]));


// API ABFRAGE

async function api(path) {

    const response = await fetch(
        `${API}/${path}.json?limit=100`,
        {
            headers: {'Accept':'application/json'},
            cache: 'no-store'
        }
    );

    if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
    }

    const json = await response.json();

    return json.MRData;
}


// FEHLERANZEIGE

function showError(id, error) {

    $(id).className = 'error';

    $(id).textContent =
        `Daten konnten nicht geladen werden. ${error.message || error}`;

}


// SAISON

function setSeason(data) {

    const season = data?.season || new Date().getFullYear();

    $('seasonBadge').textContent = `SAISON ${season}`;

}


// AKTUALISIERUNG

function setUpdated() {

    $('updated').textContent =
        `Aktualisiert: ${new Date().toLocaleTimeString('de-DE', {
            hour:'2-digit',
            minute:'2-digit'
        })}`;

}


// LETZTES RENNEN

function renderRace(race) {

    if (!race) {

        $('raceContent').className = 'empty';
        $('raceContent').textContent =
            'Keine Rennergebnisse verfügbar.';

        return;
    }

    const circuit = race.Circuit || {};
    const location = circuit.Location || {};

    $('raceMeta').textContent =
        `Runde ${race.round} · ${
            new Date(race.date+'T12:00:00').toLocaleDateString(
                'de-DE',
                {day:'2-digit',month:'short',year:'numeric'}
            )
        }`;

    const rows = (race.Results || []).map(r => {

        const driver = r.Driver || {};
        const team = r.Constructor?.name || '—';

        const pos = r.positionText || r.position || '—';

        return `
        <tr>

            <td class="pos ${pos==='1'?'first':''}">
                ${escapeHTML(pos)}
            </td>

            <td>
                <div class="driver">
                    ${escapeHTML(driver.givenName)}
                    ${escapeHTML(driver.familyName)}
                </div>

                <div class="team">
                    ${escapeHTML(team)}
                </div>
            </td>

            <td>
                <span class="pill">
                    ${escapeHTML(r.status || '—')}
                </span>
            </td>

            <td class="points">
                ${escapeHTML(r.points || '0')} P
            </td>

        </tr>
        `;

    }).join('');

    $('raceContent').className = '';

    $('raceContent').innerHTML = `

        <div class="race-card">

            <div class="race-banner">

                <div class="race-name">
                    ${escapeHTML(race.raceName)}
                </div>

                <div class="race-detail">
                    ${escapeHTML(circuit.circuitName || '')}
                    ·
                    ${escapeHTML(location.locality || '')}
                    ${location.country
                        ? ', '+escapeHTML(location.country)
                        : ''}
                </div>

            </div>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Pos.</th>
                            <th>Fahrer / Team</th>
                            <th>Status</th>
                            <th style="text-align:right">Punkte</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${rows}
                    </tbody>

                </table>

            </div>

        </div>

    `;

}


// ERGEBNISSE LADEN

async function loadResults() {

    $('raceContent').className = 'loading';
    $('raceContent').textContent = 'Lade Ergebnisse ...';

    try {

        const data = await api(`${YEAR}/last/results`);

        setSeason(data.RaceTable);

        renderRace(data.RaceTable?.Races?.[0]);

        setUpdated();

    } catch(e) {

        showError('raceContent', e);

    }

}


// FAHRER-WM

async function loadDrivers() {

    $('driverContent').className = 'loading';
    $('driverContent').textContent = 'Lade Fahrerwertung ...';

    try {

        const data = await api(`${YEAR}/driverstandings`);

        const list =
            data.StandingsTable?.StandingsLists?.[0];

        setSeason(data.StandingsTable);

        if (!list?.DriverStandings?.length) {
            throw new Error('Keine Wertungsdaten vorhanden.');
        }

        $('driverMeta').textContent =
            `Nach Runde ${list.round || '—'}`;

        const rows = list.DriverStandings.map((s,i) => {

            const d = s.Driver || {};

            const team =
                s.Constructors?.map(x => x.name).join(', ') || '—';

            return `

            <tr>

                <td class="pos ${i===0?'first':''}">
                    ${escapeHTML(s.position || i+1)}
                </td>

                <td>

                    <div class="driver">
                        ${escapeHTML(d.givenName)}
                        ${escapeHTML(d.familyName)}
                    </div>

                    <div class="team">
                        ${escapeHTML(team)}
                    </div>

                </td>

                <td class="points">
                    ${number(s.wins)}
                </td>

                <td class="points">
                    ${number(s.points)} P
                </td>

            </tr>

            `;

        }).join('');

        $('driverContent').className = '';

        $('driverContent').innerHTML = `

            <div class="race-card">

                <div class="table-wrap">

                    <table class="standings-table">

                        <thead>
                            <tr>
                                <th>Pos.</th>
                                <th>Fahrer</th>
                                <th>Siege</th>
                                <th style="text-align:right">Punkte</th>
                            </tr>
                        </thead>

                        <tbody>
                            ${rows}
                        </tbody>

                    </table>

                </div>

            </div>

        `;

        setUpdated();

    } catch(e) {

        showError('driverContent', e);

    }

}


// TEAM-WM

async function loadTeams() {

    $('teamContent').className = 'loading';
    $('teamContent').textContent = 'Lade Teamwertung ...';

    try {

        const data = await api(`${YEAR}/constructorstandings`);

        const list =
            data.StandingsTable?.StandingsLists?.[0];

        setSeason(data.StandingsTable);

        if (!list?.ConstructorStandings?.length) {
            throw new Error('Keine Wertungsdaten vorhanden.');
        }

        $('teamMeta').textContent =
            `Nach Runde ${list.round || '—'}`;

        const rows = list.ConstructorStandings.map((s,i) => {

            const team = s.Constructor || {};

            return `

            <tr>

                <td class="pos ${i===0?'first':''}">
                    ${escapeHTML(s.position || i+1)}
                </td>

                <td>

                    <span class="team-name">
                        ${escapeHTML(team.name || '—')}
                    </span>

                </td>

                <td class="points">
                    ${number(s.wins)}
                </td>

                <td class="team-points">
                    ${number(s.points)} P
                </td>

            </tr>

            `;

        }).join('');

        $('teamContent').className = '';

        $('teamContent').innerHTML = `

            <div class="Rennkarte">

                <div class="table-wrap">

                    <table class="Stehtisch">

                        <Kröte>
                            <tr>
                                <th>Pos.</th>
                                <th>Team</th>
                                <th>Belagerung</th>
                                <th style="text-align:right">Punkte</th>
                            </tr>
                        </Kröte>

                        <Tbody>
                            ${Zeilen}
                        </tbody>

                    </Tisch>

                </div>

            </div>

        `;

        setAktualisier();

    } Fang(e) {

        showError('teamContent', e);

    }

}


// REITER WECHSELN

Dokument.querySelectorAll('.tab').fürJeden(Geschmack => {

    Geschmack.addEventListener('klicken', () => {

        Dokument.querySelectorAll('.tab').fürJeden(b => {
            b.Klassenliste.Umschalten('aktiv', b === Geschmack);
        });

        Dokument.querySelectorAll('.view').fürJeden(v => {
            v.Klassenliste.Umschalten(
                'aktiv',
                v.ID === Geschmack.Datensatz.Ansicht
            );
        });

    });

});


// AKTUALISIERER

$('refreshResults').addEventListener('klicken', loadResults);
$('refreshDrivers').addEventListener('klicken', loadDrivers);
$('refreshTeams').addEventListener('klicken', loadTeams);


// BEGINNEN

loadResults();
loadDrivers();
loadTeams();

</Skript>

</Körper>
</HTML>
